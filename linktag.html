<!DOCTYPE html>
<html>
<head>
    <title>HTML Link Tag Example</title>
</head>
<body>

    <h1>HTML Link Tag Demonstration</h1>
    <p>
        Visit Google:
        <a href="https://www.google.com">Click here</a>
    </p>
    <p>
        Open YouTube in new tab:
        <a href="https://www.youtube.com" target="_blank">YouTube</a>
    </p>
    <p>
        Send Email:
        <a href="mailto:example@gmail.com">Email Us</a>
    </p>
    <p>
        Click the image:
        <a href="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSxu5LvYpFPqcJCukwhYVpjzyLhs9kCc9CCfA&s">
            <img src="image.jpg" alt="Sample Image" width="150">
        </a>
    </p>

</body>
</html>
